name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

      - name: Resolve tag
        id: resolve_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_MD="$RUNNER_TEMP/release_notes.md"
          NOTES_HTML="$RUNNER_TEMP/release_notes.html"

          # PR-driven path: GitHub reads .github/release.yml and groups merged
          # PRs since the previous tag by label.
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -q .body > "$NOTES_MD"

          # Direct-commit fallback: if no PRs were merged in this range, the
          # API only returns a "Full Changelog" link with no "## What"-style
          # section. Synthesize a "## Changes" block from git log.
          if ! grep -qF '## What' "$NOTES_MD"; then
            git fetch --tags --unshallow 2>/dev/null || git fetch --tags
            PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${TAG}"
            else
              RANGE="$TAG"
            fi
            COMMITS="$(git log --no-merges --pretty=format:"- %s ([\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$RANGE")"
            if [ -n "$COMMITS" ]; then
              {
                echo "## Changes"
                echo
                echo "$COMMITS"
                echo
                cat "$NOTES_MD"
              } > "${NOTES_MD}.new"
              mv "${NOTES_MD}.new" "$NOTES_MD"
            fi
          fi

          # GFM → HTML so Sparkle's WebView can render it inline. GFM mode
          # auto-links #123 to PRs and @user to profiles.
          MD_BODY="$RUNNER_TEMP/markdown_payload.json"
          jq -Rs --arg ctx "$GITHUB_REPOSITORY" '{text: ., mode: "gfm", context: $ctx}' "$NOTES_MD" > "$MD_BODY"
          gh api -X POST /markdown --input "$MD_BODY" > "$NOTES_HTML"

          echo "notes_md=$NOTES_MD" >> "$GITHUB_OUTPUT"
          echo "notes_html=$NOTES_HTML" >> "$GITHUB_OUTPUT"

      - name: Resolve Sparkle artifacts
        run: swift package resolve

      - name: Write Sparkle EdDSA private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/sparkle_ed_private_key"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_PATH"
          echo "SPARKLE_PRIVATE_KEY_FILE=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package
        env:
          SPARKLE_RELEASE_NOTES_FILE: ${{ steps.notes.outputs.notes_html }}
          SPARKLE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: ./scripts/package_release.sh

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
          NOTES_MD: ${{ steps.notes.outputs.notes_md }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "CCAS $TAG" --notes-file "$NOTES_MD"
          fi
          gh release upload "$TAG" dist/CCAS-*.zip dist/CCAS-*.dmg --clobber

      - name: Publish appcast to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          rm -rf "$PAGES_DIR"
          mkdir -p "$PAGES_DIR"

          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REMOTE_URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages --single-branch "$REMOTE_URL" "$PAGES_DIR"
          else
            git -C "$PAGES_DIR" init -q -b gh-pages
            git -C "$PAGES_DIR" remote add origin "$REMOTE_URL"
          fi

          if [ ! -f "$PAGES_DIR/appcast.xml" ]; then
            cp scripts/appcast-template.xml "$PAGES_DIR/appcast.xml"
          fi

          python3 scripts/merge_appcast.py "$PAGES_DIR/appcast.xml" dist/appcast-item.xml

          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml unchanged; nothing to publish."
          else
            git commit -m "Publish appcast for $TAG"
            git push origin gh-pages
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/sparkle_ed_private_key"
